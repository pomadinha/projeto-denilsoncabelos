<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#181b19" />
    <title>Administração | Denilson Cabelos</title>
    <link rel="icon" href="assets/logo.png" type="image/svg+xml" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="admin.js"></script>
  </head>
  <body>
    <header class="topo">
      <div class="container topo-conteudo">
        <a href="./" class="marca">
          <img class="logo-header" src="assets/logo.png" alt="" />
          <span>DENILSON<small>PAINEL ADMINISTRATIVO</small></span>
        </a>
        <nav>
          <a href="./" class="nav-pedido">← Voltar ao catálogo</a>
        </nav>
      </div>
    </header>

    <main class="container py-5">
      <!-- Tela de Login -->
      <section id="telaLogin" class="mx-auto" style="max-width: 400px">
        <div class="painel" style="position: static">
          <p class="sobretitulo escuro">ACESSO RESTRITO</p>
          <h2>Entrar no Painel</h2>
          <p class="aviso-demo mt-2 mb-3">
            Digite a senha do proprietário para gerenciar o estoque e preços.
          </p>
          <form id="formLogin">
            <div class="mb-3">
              <label for="senhaAdmin" class="form-label fw-bold small"
                >Senha de Acesso</label
              >
              <input
                type="password"
                id="senhaAdmin"
                class="form-control"
                placeholder="••••••"
                required
              />
            </div>
            <button type="submit" class="botao botao-verde w-100">
              Acessar Gestão <span>→</span>
            </button>
            <p id="erroLogin" class="aviso mt-2"></p>
          </form>
        </div>
      </section>

      <!-- Painel Principal -->
      <section id="painelAdmin" hidden>
        <div
          class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"
        >
          <div>
            <p class="sobretitulo escuro mb-1">GERENCIAMENTO EM TEMPO REAL</p>
            <h2 class="m-0" style="font-family: Impact, sans-serif">
              Produtos da Barbearia
            </h2>
          </div>
          <div class="d-flex gap-2 flex-wrap">
            <button
              type="button"
              id="btnImportarIniciais"
              class="botao botao-cobre"
              hidden
            >
              Importar Produtos Iniciais para Nuvem
            </button>
            <button
              type="button"
              id="btnNovoProduto"
              class="botao botao-verde"
            >
              + Novo Produto
            </button>
          </div>
        </div>

        <!-- Formulário de Cadastro / Edição -->
        <div id="boxFormulario" class="painel mb-4" style="position: static" hidden>
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 id="tituloForm" class="m-0 h5 fw-bold">Cadastrar Produto</h3>
            <button
              type="button"
              id="btnFecharForm"
              class="btn btn-sm btn-outline-secondary"
            >
              Fechar ✕
            </button>
          </div>

          <form id="formProduto" class="row g-3">
            <input type="hidden" id="prodId" />

            <div class="col-md-6">
              <label for="prodNome" class="form-label small fw-bold"
                >Nome do Produto *</label
              >
              <input
                type="text"
                id="prodNome"
                class="form-control"
                placeholder="Ex: Fox For Men - Pasta Black"
                required
              />
            </div>

            <div class="col-md-3">
              <label for="prodCategoria" class="form-label small fw-bold"
                >Categoria *</label
              >
              <select id="prodCategoria" class="form-select" required>
                <option value="Cabelo">Cabelo</option>
                <option value="Barba">Barba</option>
                <option value="Eletronicos">Eletrônicos</option>
                <option value="Camisas">Camisas</option>
              </select>
            </div>

            <div class="col-md-3">
              <label for="prodPreco" class="form-label small fw-bold"
                >Preço (R$) *</label
              >
              <input
                type="number"
                id="prodPreco"
                class="form-control"
                step="0.01"
                min="0.01"
                placeholder="25.00"
                required
              />
            </div>

            <div class="col-md-6">
              <label for="prodDescricao" class="form-label small fw-bold"
                >Descrição curta</label
              >
              <textarea
                id="prodDescricao"
                class="form-control"
                rows="2"
                placeholder="Efeito matte, fixação forte..."
              ></textarea>
            </div>

            <div class="col-md-6">
              <label for="prodUso" class="form-label small fw-bold"
                >Como usar</label
              >
              <textarea
                id="prodUso"
                class="form-control"
                rows="2"
                placeholder="Aplique uma pequena quantidade nos fios secos..."
              ></textarea>
            </div>

            <div class="col-md-6">
              <label for="prodFoto" class="form-label small fw-bold"
                >Foto do Produto (Galeria ou Câmera)</label
              >
              <input
                type="file"
                id="prodFoto"
                class="form-control"
                accept="image/*"
              />
              <small class="text-muted d-block mt-1">
                A foto é comprimida automaticamente para carregar rápido no
                celular.
              </small>
            </div>

            <div class="col-md-6 d-flex align-items-center gap-3">
              <img
                id="previewFoto"
                src="assets/logo.png"
                alt="Prévia"
                style="
                  width: 64px;
                  height: 64px;
                  object-fit: cover;
                  border-radius: 4px;
                  border: 1px solid #ccc;
                "
              />
              <div class="form-check form-switch">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="prodDisponivel"
                  checked
                />
                <label class="form-check-label fw-bold small" for="prodDisponivel"
                  >Disponível para consulta</label
                >
              </div>
            </div>

            <div class="col-12 d-flex gap-2 pt-2">
              <button
                type="submit"
                id="btnSalvarProduto"
                class="botao botao-verde"
              >
                Salvar no Banco de Dados
              </button>
              <span id="statusSalvar" class="align-self-center small text-muted"></span>
            </div>
          </form>
        </div>

        <!-- Lista de Produtos Cadastrados -->
        <div id="listaAdmin" class="produtos-grid"></div>
      </section>
    </main>
  </body>
</html>
