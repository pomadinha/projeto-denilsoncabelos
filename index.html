<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teste do pedido</title>
  <script src="script.js" defer></script>
</head>
<body>
  <h1>Produtos da barbearia</h1>

  <form id="formPedido">
    <p>
      <label>
        <input type="checkbox" name="produtos"
               value="35.00" data-nome="Pomada Modeladora">
        Pomada Modeladora — R$ 35,00
      </label>
    </p>

    <p>
      <label>
        <input type="checkbox" name="produtos"
               value="28.00" data-nome="Óleo para Barba">
        Óleo para Barba — R$ 28,00
      </label>
    </p>

    <p>
      <label>
        <input type="checkbox" name="produtos"
               value="32.00" data-nome="Balm para Barba">
        Balm para Barba — R$ 32,00
      </label>
    </p>

    <button type="submit">Finalizar pedido</button>
  </form>

  <p id="aviso" role="status"></p>
</body>
</html>
